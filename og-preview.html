<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 50px;
            padding: 60px;
        }
        .photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #60a5fa;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
        }
        .text h1 {
            font-size: 44px;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 10px;
        }
        .text h2 {
            font-size: 24px;
            font-weight: 500;
            color: #60a5fa;
            margin-bottom: 16px;
        }
        .text p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.5;
            max-width: 520px;
        }
        .tags {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .tags span {
            background: rgba(96, 165, 250, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: #60a5fa;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .url {
            position: absolute;
            bottom: 25px;
            right: 35px;
            color: #475569;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="assets/profile.jpg" class="photo">
        <div class="text">
            <h1>Hadj Habib Rouabah</h1>
            <h2>AI Engineer & ML Specialist</h2>
            <p>Machine Learning · LLM · RAG · AI Agents · Google ADK</p>
        </div>
    </div>
    <div class="url">habib-rouabah.github.io</div>
</body>
</html>
